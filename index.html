<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a3590">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="코멘트기록">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>현장 코멘트 기록</title>
<style>
/* 레이아웃: 태블릿 가로 2단(기록 | 분류 초안), 760px 이하는 1단. 색은 모두 토큰으로만 쓴다. 외부 글꼴은 쓰지 않는다(오프라인 동작). */
:root{--bg:#f3f4f8;--card:#fff;--ink:#1c2233;--mut:#667085;--line:#dde0ea;--pri:#2a3590;--bt:#fff;--soft:#e8ebf8;--hd:#eff1f8;--ok:#17703d;--okb:#dff3e6;--wn:#7a5c00;--wnb:#fbe9a6;--bd:#b3261e;--bdb:#fbe3e0;--code:#f6f7fb;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--ink:#e8eaf2;--mut:#9aa2b8;--line:#2e3344;--pri:#97a3ff;--bt:#10131f;--soft:#262b45;--hd:#232737;--ok:#6fd49a;--okb:#16352a;--wn:#f0d36b;--wnb:#3b3210;--bd:#ff9a90;--bdb:#3d1f1d;--code:#161924;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:17px;color:var(--pri)}
.tabs{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--pri);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--pri);padding:0 16px;min-height:40px;cursor:pointer;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--pri);color:var(--bt)}
.grid .seg{display:flex;width:100%}.grid .seg button{flex:1;min-width:0;padding:0 8px}
main{max-width:1180px;margin:0 auto;padding:12px 16px 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--pri);font-size:12px}
.mut{color:var(--mut);font-size:12px}
.btn{border:1px solid var(--pri);background:var(--card);color:var(--pri);border-radius:8px;padding:0 14px;min-height:40px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.p{background:var(--pri);color:var(--bt)}
.btn.sm{font-size:13px}
.btn.rec{border-color:var(--bd);color:var(--bd)}
.btn.rec.live{background:var(--bd);color:var(--bt)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:12px;align-items:start}
.work>.card{margin-bottom:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.note{font-size:12px;color:var(--mut);margin:6px 0 0}
label.f{display:block;font-size:12px;color:var(--mut)}
label.f>.in{margin-top:3px}
input.in,select.in{width:100%;min-height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14px}
textarea.txt{width:100%;min-height:92px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);resize:vertical;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:8px}
.th{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--hd)}
.th img{display:block;width:100%;height:78px;object-fit:cover;cursor:zoom-in}
.th .m{font-size:11.5px;padding:2px 6px;color:var(--mut);display:flex;justify-content:space-between;gap:4px}
.th .x{position:absolute;top:2px;right:2px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;line-height:1;font-size:16px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--hd);color:var(--mut);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.wn{background:var(--wnb);color:var(--wn)}.pill.bd{background:var(--bdb);color:var(--bd)}.pill.nv{background:var(--soft);color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;min-height:40px;padding:0 14px;cursor:pointer;font-size:13px}
.chip.on{background:var(--pri);color:var(--bt);border-color:var(--pri)}
.fld{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px}
.fld.lo,.it.lo{border-color:var(--wn)}
.fld .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.fld .hd b{font-size:13px}
.ev{font-size:12px;color:var(--mut)}
.bar{height:5px;border-radius:3px;background:var(--hd);overflow:hidden;width:70px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--ok)}.bar.lo i{background:var(--wn)}
.items{display:grid;gap:8px}
.it{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px}
.it .r{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px;align-items:start}
.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;justify-content:flex-end}
.foot .st{margin-right:auto;font-size:13px}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.live-txt{min-height:20px;color:var(--mut);font-size:13px;font-style:italic}
.selbox{display:inline-grid;place-items:center;min-width:40px;min-height:40px;margin:-8px 0 -8px -8px;cursor:pointer}.selbox input{width:22px;height:22px;accent-color:var(--pri)}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.rc{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;background:var(--card)}
.rc .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.rc .h b{font-size:13px}
.rc .t{white-space:pre-wrap;word-break:break-word}
.rc .ph{display:flex;gap:6px;flex-wrap:wrap}.rc .ph img{width:56px;height:42px;object-fit:cover;border-radius:6px;cursor:zoom-in;border:1px solid var(--line)}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;z-index:200;max-width:92vw}
/* 권한 게이트 */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .card{max-width:560px;width:100%;margin:0}
.gate h1{font-size:20px;margin:0 0 6px}
.perm{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.perm b{flex:1}
.how{background:var(--hd);border-radius:8px;padding:10px 12px;font-size:13px}
.how ol{margin:4px 0 0;padding-left:20px}
/* 카메라 */
.cam{position:fixed;inset:0;background:#000;z-index:100;display:grid;grid-template-columns:minmax(0,1fr) auto;color:#fff}
.cam video{width:100%;height:100%;object-fit:contain;background:#000;min-height:0}
.cam .ctl{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:14px 18px;min-width:120px}
.cam .ctl{overflow-y:auto}.cam .ctl .btn{flex:none;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff;min-width:96px}
.shutter{flex:none;box-sizing:border-box;width:76px;height:76px;min-width:76px;min-height:76px;aspect-ratio:1/1;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer;padding:0}
.shutter:active{background:#fff}
.cam .cnt{font-size:13px}
.cam .ctl .btn.on{background:#ffd23f;border-color:#ffd23f;color:#111}
.cam .hint{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) rotate(var(--rot,0deg));transition:transform .25s;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:6px 14px;font-size:13px;max-width:90%;text-align:center}
.cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam .flash.go{animation:fl .18s ease-out}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}
.cam .strip{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;max-width:60%}
.cam .strip img{width:54px;height:40px;object-fit:cover;border-radius:6px;border:2px solid #fff}
.cam .ctl>:not(.cnt){transform:rotate(var(--rot,0deg));transition:transform .25s}.cam .ctl .shutter{transform:none}.cam .cnt i{display:inline-block;font-style:normal;transform:rotate(var(--rot,0deg));transition:transform .25s}
@media(orientation:portrait){.cam{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.cam .ctl{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px 12px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}.cam .ctl .shutter{order:-1;margin:0 calc(50% - 38px)}.cam .ctl .cnt{order:-2;flex:0 0 100%;text-align:center}.cam .ctl .btn{min-width:84px;padding:0 10px}.cam .strip{bottom:190px}}
@media(orientation:landscape) and (max-height:430px){.cam .ctl{gap:8px;padding:8px 14px}.cam .ctl .btn{min-height:36px}}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:150;display:grid;place-items:center;padding:12px}
.lb img{max-width:100%;max-height:calc(100vh - 80px);object-fit:contain;border-radius:6px}
.lb .btn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.4)}
@media(max-width:760px){.work{grid-template-columns:1fr}.tabs{margin-left:0;width:100%}.seg{width:100%}.seg button{flex:1;padding:0 6px}.it .r{grid-template-columns:1fr}.recs{grid-template-columns:1fr}}
@media(max-height:430px){.top{padding:4px 12px}.card{padding:10px}main{padding-top:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 권한 게이트: 카메라와 마이크가 모두 허용되기 전에는 앱을 열지 않는다 -->
<section class="gate" id="gate" hidden></section>

<div id="app" hidden>
<header class="top">
  <div class="brand"><b>현장 코멘트 기록</b><span class="pill nv" id="verPill"></span></div>
  <button class="btn sm" id="installBtn" hidden>앱 설치</button>
  <nav class="seg tabs" id="tabs" role="tablist" aria-label="화면">
    <button role="tab" data-act="tab" data-tab="rec" class="on" aria-selected="true">기록</button>
    <button role="tab" data-act="tab" data-tab="list" aria-selected="false">내역 <span id="cnt"></span></button>
    <button role="tab" data-act="tab" data-tab="set" aria-selected="false">설정</button>
  </nav>
</header>

<main>
<section id="tab-rec">
  <div class="card" id="ctx"></div>
  <div class="work">
    <div class="card" id="left">
      <h2><span class="n">1</span>사진</h2>
      <div class="row">
        <button class="btn p" data-act="openCam">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>카메라로 찍기</button>
        <button class="btn" data-act="pickPhoto">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/></svg>기존 사진 불러오기</button>
        <input type="file" id="pickFile" accept="image/*" multiple hidden>
      </div>
      <div class="thumbs" id="thumbs"></div>

      <h2 style="margin-top:14px"><span class="n">2</span>말하거나 입력</h2>
      <div class="row" style="margin-bottom:8px">
        <button class="btn rec" id="micBtn" data-act="mic">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="micLbl">말하기</span></button>
        <span class="mut" id="voiceMsg"></span>
      </div>
      <textarea class="txt" id="text" aria-label="코멘트 내용" placeholder="말한 내용이 여기에 받아써집니다. 직접 고치거나 입력해도 됩니다."></textarea>
      <div class="live-txt" id="interim" aria-live="polite"></div>
      <div class="foot" style="justify-content:flex-start">
        <button class="btn p" id="clsBtn" data-act="classify">자동 분류</button>
        <button class="btn" data-act="clear">비우기</button>
      </div>
    </div>
    <div class="card" id="right"></div>
  </div>
</section>

<section id="tab-list" hidden></section>
<section id="tab-set" hidden></section>
</main>
</div>

<div class="cam" id="cam" hidden>
  <video id="camVideo" autoplay playsinline muted></video>
  <div class="flash" id="camFlash"></div>
  <div class="hint" id="camHint" hidden>어두워 보입니다. 플래시를 켜 보세요.</div>
  <div class="strip" id="camStrip"></div>
  <div class="ctl">
    <span class="cnt"><i id="camCnt">0장</i></span>
    <button class="btn" id="torchBtn" data-act="torch" aria-pressed="false" hidden>플래시 꺼짐</button>
    <button class="shutter" data-act="shot" aria-label="사진 찍기"></button>
    <button class="btn" data-act="flip">앞·뒤 전환</button>
    <button class="btn" data-act="closeCam">완료</button>
  </div>
</div>
<div class="lb" id="lb" hidden><button class="btn" data-act="closeLb">닫기</button><img id="lbImg" alt="확대한 현장 사진"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const APP_VER = "1.4.0";

/* ===== 기준 데이터: SEJIN 기본 ITP 마스터의 검사종류 I-01~I-62 (ERP 코드는 쓰지 않는다) ===== */
const KINDS_RAW = `I-01|STRUCTURE|BLOCK INSPECTION|ASSEMBLY BLOCK
I-02|STRUCTURE|BLOCK INSPECTION|GLAND ASSEMBLY BLOCK
I-03|STRUCTURE|BLOCK INSPECTION|DOME FABRICATION INSPECTION (with Air Test)
I-04|STRUCTURE|BLOCK with OUTFITTING INSPECTION|RADAR MAST
I-05|STRUCTURE|BLOCK with OUTFITTING INSPECTION|FUNNNEL
I-06|STRUCTURE|FIT-UP INSPECTION|FIT-UP INSPECTION
I-07|STRUCTURE|PE INSPECTION|PE INSPECTION
I-08|STRUCTURE|Production Weld Test|PUNCHING INSPECTION
I-09|STRUCTURE|Production Weld Test|MECHANICAL TEST
I-10|STRUCTURE|Tightness test|AIR TEST
I-11|STRUCTURE|Tightness test|VACCUME TEST
I-12|STRUCTURE|Tightness test|TANK HYDRO TEST
I-13|STRUCTURE|CLEANING INSPECTION|TANK CLEANING
I-62|STRUCTURE|PWHT|PWHT (SUMP 류)
I-14|OUTFITTING|CHALK TEST|SIDE SCUTTLE, WINDOW (OPEN TYPE Only)
I-15|OUTFITTING|CHALK TEST|LOURVER VENT
I-16|OUTFITTING|HOSE TEST|STEEL DOOR (WATER TIGHT DOOR)
I-17|OUTFITTING|HOSE TEST|SIDE SCUTTLE, WINDOW
I-18|OUTFITTING|VISUAL INSPECTION|OUTFITTING INSPECTION
I-19|OUTFITTING|VISUAL INSPECTION|EXPENSION JOINT INSTALLATION
I-20|OUTFITTING|VISUAL INSPECTION|INSTALLATION / VISUAL INSPECTION
I-21|OUTFITTING|VISUAL INSPECTION|PRE-OUTFITTING INSPECTION
I-22|OUTFITTING|VISUAL INSPECTION|PASSIVATION INSPECTION
I-23|OUTFITTING|CLEANING INSPECTION|CLEANING INSPECTION
I-24|PIPING|HYDRO TEST|FIRE&WASH DECK LINE
I-25|PIPING|HYDRO TEST|SERVICE COMPRESSED AIR LINE
I-26|PIPING|HYDRO TEST|AIR HORN LINE
I-27|PIPING|HYDRO TEST|FRESH WATER LINE
I-28|PIPING|HYDRO TEST|SAMPLING/SPILL TANK DRAIN LINE
I-29|PIPING|HYDRO TEST|INCIN. W.O LINE
I-30|PIPING|HYDRO TEST|STEAM SUPPLY ENCLOSED PART
I-31|PIPING|HYDRO TEST|*
I-32|PIPING|LEAK TEST|ANSUL LINE
I-33|PIPING|LEAK TEST|CO2 LINE
I-34|PIPING|LEAK TEST|HIGH EXPASION FOAM SYSTEM
I-35|PIPING|LEAK TEST|WATER BASED LOCAL FIRE FIGHTING SYSTEM
I-36|PIPING|LEAK TEST|N2 GAS PURGE LINE
I-37|PIPING|LEAK TEST|*
I-38|PIPING|FLOODING TEST|SOIL LINE
I-39|PIPING|AIR BLOWING INSPECTION|SCUPPER AIR BLOWING
I-40|PIPING|FIT-UP INSPECTION|PIPE / NOZZLE FIT-UP INSPECTION
I-41|ELECTRIC|CABLE INSTALLATION INSPECTION|CABLE INSTALLATION INSPECTION
I-42|INSULATION|INSULATION INSPECTION|THERMAL
I-43|INSULATION|INSULATION INSPECTION|A60
I-44|INSULATION|INSULATION INSPECTION|TANK
I-45|INSULATION|INSULATION INSPECTION|PRE-SURFACE
I-46|FIRE PROTECTION|DRAFT STOP INSTAL. INSPECTION|DRAFT STOP INSTALLATION INSPECTION
I-47|PAINT|SURFACE PREPARATION INSPECTION|EXTERNAL
I-48|PAINT|SURFACE PREPARATION INSPECTION|INTERNAL
I-49|PAINT|EACH INTER COATING INSPECTION|EXTERNAL (1ST)
I-50|PAINT|EACH INTER COATING INSPECTION|INTERNAL (1ST)
I-51|PAINT|EACH INTER COATING INSPECTION|EXTERNAL (2ND)
I-52|PAINT|EACH INTER COATING INSPECTION|INTERNAL (2ND)
I-53|PAINT|EACH INTER COATING INSPECTION|EXTERNAL (3RD)
I-54|PAINT|EACH INTER COATING INSPECTION|INTERNAL (3RD)
I-55|PAINT|FINAL INSPECTION|EXTERNAL
I-56|PAINT|FINAL INSPECTION|INTERNAL
I-57|NDE|MT|
I-58|NDE|UT|
I-59|NDE|RT|
I-60|NDE|PT|
I-61|NDE|PAUT|`;
const KINDS = KINDS_RAW.split("\n").map(l => { const a = l.split("|"); return { id: a[0], group: a[1], major: a[2], minor: a[3] === "*" ? "(세부 미정)" : a[3] || "" }; });
const KIND = Object.fromEntries(KINDS.map(k => [k.id, k]));
const GROUPS = [...new Set(KINDS.map(k => k.group))];
// 화면에는 검사종류 '중'(major)만 보여 준다. 내부 값(I-번호, 소)은 그대로 유지한다.
const kindLabel = id => { const k = KIND[id]; return k ? k.major : id; };
const kindKey = id => { const k = KIND[id]; return k ? k.group + "|" + k.major : ""; };
const KIND_REP = (() => { const m = {}; KINDS.slice().sort((a, b) => a.id.localeCompare(b.id)).forEach(k => { const key = k.group + "|" + k.major; if (!m[key]) m[key] = k; }); return m; })();

const TYPES = ["용접", "사상", "곡직", "취부", "DAMAGE", "미작업", "LEAK", "비파괴", "정도", "안전(족장)", "청소", "기타"];
const PARTNERS = ["선조", "선탑", "선의", "선기", "선전", "선보", "선목", "선도"];

/* ===== 저장소(IndexedDB): 기록은 records, 사진 원본은 photos ===== */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("field-comment", 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("records", { keyPath: "id" }); d.createObjectStore("photos", { keyPath: "id" }); };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  run(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = DB.db.transaction(store, mode), st = tx.objectStore(store), rq = fn(st);
      tx.oncomplete = () => res(rq ? rq.result : undefined); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  put(store, obj) { return DB.run(store, "readwrite", s => s.put(obj)); },
  get(store, key) { return DB.run(store, "readonly", s => s.get(key)); },
  all(store) { return DB.run(store, "readonly", s => s.getAll()); },
  del(store, key) { return DB.run(store, "readwrite", s => s.delete(key)); },
  clear(store) { return DB.run(store, "readwrite", s => s.clear()); }
};

/* 플래시(토치): 카메라 권한 안에서 쓰는 기능이라 별도 권한은 없다. 뒷면 카메라에서만 쓴다.

  for (let i = 0; i < tries; i++) { try { if (tr.getCapabilities && tr.getCapabilities().torch) return true; } catch (e) { } await sleep(350); }
  return false;

  stopStream();
  let devs = []; try { devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput"); } catch (e) { }
  for (const d of devs) {
    if (/front|user|전면/i.test(d.label)) continue;
    let s; try { s = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: d.deviceId } }, audio: false }); } catch (e) { continue; }
    const ok = await trackHasTorch(s.getVideoTracks()[0], 3); s.getTracks().forEach(x => x.stop());
    if (ok) return d.deviceId;
  }

}

  if (await trackHasTorch(tr, 4)) { if (tr === camTrack) { S.torchOk = true; renderTorch(); } return; }

  if (!noSearch) {
    toast("플래시가 되는 카메라를 찾는 중…");

    if (id) lsSet("torchDevice", id);

/* ===== 패키지(zip): 사진과 코멘트를 한 파일로 묶어 메일·메신저로 보낸다 ===== */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) { // 압축 없이 담는 zip(사진은 이미 JPEG라 압축 이득이 없다). 파일명은 UTF-8
  const enc = new TextEncoder(), d = new Date(), tm = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dt = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], cds = []; let off = 0;
  for (const f of files) {
    const nb = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(10, tm, true); lh.setUint16(12, dt, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true); lh.setUint16(26, nb.length, true);
    parts.push(lh.buffer, nb, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(12, tm, true); ch.setUint16(14, dt, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true); ch.setUint16(28, nb.length, true); ch.setUint32(42, off, true);
    cds.push(ch.buffer, nb); off += 30 + nb.length + sz;
  }
  const cdSize = cds.reduce((a, b) => a + b.byteLength, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...cds, end.buffer], { type: "application/zip" });
}
async function sha256(u8) { try { const h = await crypto.subtle.digest("SHA-256", u8); return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, "0")).join(""); } catch (e) { return null; } }
const asciiName = s => String(s).replace(/[^A-Za-z0-9._-]/g, "_");
function splitRecords(recs, limit) { // 같은 때 등록한 코멘트(사진 공유)는 한 묶음으로 두고, 크기 제한을 넘으면 다음 파일로 나눈다
  const g = new Map();
  recs.slice().sort((a, b) => (a.created_at + a.id).localeCompare(b.created_at + b.id)).forEach(r => { if (!g.has(r.batch)) g.set(r.batch, []); g.get(r.batch).push(r); });
  const out = []; let cur = [], size = 0;
  for (const rs of g.values()) {
    const seen = new Set(); let sz = 3000 * rs.length; rs.forEach(r => r.photos.forEach(p => { if (!seen.has(p.id)) { seen.add(p.id); sz += p.size; } }));
    if (limit && cur.length && size + sz > limit) { out.push(cur); cur = []; size = 0; }
    cur.push(...rs); size += sz;
  }
  if (cur.length) out.push(cur);
  return out;
}
async function buildPart(recs, idx, total, st) {
  const enc = new TextEncoder(), names = new Map(), files = [], list = [], missing = [];
  for (const r of recs) for (let i = 0; i < r.photos.length; i++) {
    const p = r.photos[i]; if (names.has(p.id)) continue;
    const rec = await DB.get("photos", p.id);
    if (!rec) { names.set(p.id, null); missing.push(p.id); continue; }
    const data = new Uint8Array(await rec.blob.arrayBuffer()), name = "photos/" + asciiName(r.no) + "_p" + (i + 1) + ".jpg";
    names.set(p.id, name); files.push({ name, data });
  }
  const json = recs.map(r => { const o = Object.assign({}, r); o.photos = r.photos.map(p => ({ file: names.get(p.id), id: p.id, w: p.w, h: p.h, size: p.size, taken_at: p.taken_at, origin: p.origin || "camera" })); return o; });
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const head = ["번호", "일시", "호선", "위치구분", "위치", "검사종류(중)", "발행", "유형", "조치협력사", "내용", "위치메모", "사진파일", "상태", "작성자"];
  const rows = json.map(r => [r.no, r.created_at.replace("T", " "), r.ship, r.block ? "BLOCK" : r.deck ? "DECK" : "", r.block || r.deck || "", r.kind_ids[0] && KIND[r.kind_ids[0]] ? KIND[r.kind_ids[0]].major : "", SOURCES.find(s => s[0] === r.source)[1], r.type, r.action_party, r.text_final, r.location_note, r.photos.map(p => p.file || "(사진 없음)").join(" ; "), r.status, r.author].map(q).join(","));
  const csv = enc.encode("﻿" + [head.map(q).join(",")].concat(rows).join("\r\n"));
  const js = enc.encode(JSON.stringify({ schema: "field-comment-package/1", records: json }, null, 2));
  const all = [{ name: "comments.csv", data: csv }, { name: "comments.json", data: js }].concat(files);
  for (const f of all) list.push({ name: f.name, size: f.data.length, sha256: await sha256(f.data) });
  const manifest = enc.encode(JSON.stringify({ schema: "field-comment-package/1", app: "field-comment", app_version: APP_VER, created_at: nowIso(), part: { index: idx, total }, counts: { records: recs.length, photos: files.length }, missing_photos: missing, files: list }, null, 2));
  const blob = makeZip([{ name: "manifest.json", data: manifest }].concat(all));
  return { name: "comment-pkg_" + st + (total > 1 ? "_" + idx + "of" + total : "") + ".zip", blob, ids: recs.map(r => r.id), records: recs.length, photos: files.length, size: blob.size, done: "" };
}
async function makePkg() {
  if (S.pkgBusy) return;
  const recs = S.records.filter(r => S.sel.has(r.id));
  if (!recs.length) { toast("묶을 코멘트를 선택하세요."); return; }
  const lim = (+$("#pkgLimit").value || 0) * 1048576; lsSet("pkgLimit", $("#pkgLimit").value);
  S.pkgBusy = true; updatePkgBtn();
  try {
    const groups = splitRecords(recs, lim), st = stamp(), out = [];
    for (let i = 0; i < groups.length; i++) out.push(await buildPart(groups[i], i + 1, groups.length, st));
    S.pkgs = out; renderPkgOut(); toast("패키지 " + out.length + "개를 만들었습니다.");
  } catch (e) { toast("패키지를 만들지 못했습니다. 저장 공간을 확인하세요."); }
  S.pkgBusy = false; updatePkgBtn();
}
async function markPackaged(pk, how) {

  pk.done = how + " " + at.slice(11, 16); renderList();
}
function sendPkg(i) { // 공유 창(카카오톡·메일 등). 크롬은 zip 공유를 막아서, 안 되면 이름 끝에 .txt를 붙여 보낸다. 사용자 터치 직후 바로 호출해야 한다.
  const pk = S.pkgs[i]; if (!pk) return;
  const zip = new File([pk.blob], pk.name, { type: "application/zip" });
  const txt = new File([pk.blob], pk.name + ".txt", { type: "text/plain" });
  const can = f => { try { return !!(navigator.canShare && navigator.canShare({ files: [f] })); } catch (e) { return false; } };
  const f = can(zip) ? zip : can(txt) ? txt : null, asTxt = f === txt;
  if (!f || !navigator.share) { toast("이 기기는 공유 창을 지원하지 않아 파일로 저장합니다."); savePkg(i); return; }
  navigator.share({ files: [f], title: "현장 코멘트 패키지 " + pk.records + "건" })
    .then(() => { markPackaged(pk, asTxt ? "공유 창 열림(.txt)" : "공유 창 열림"); if (asTxt) toast("받는 쪽에서 파일 이름 끝의 .txt를 지우면 zip으로 열립니다."); })
    .catch(e => { if (e && e.name !== "AbortError") { toast("공유하지 못해 파일로 저장합니다."); savePkg(i); } });
}
function savePkg(i) { const pk = S.pkgs[i]; if (!pk) return; download(pk.name, pk.blob); markPackaged(pk, "저장"); }
function pkgBarHtml() {
  const lim = lsGet("pkgLimit", "20");
  return '<div class="card" id="pkgCard"><h2>패키지로 묶어 보내기 <span class="mut">사진 + 코멘트를 zip 한 파일로</span></h2>' +
    '<div class="row"><button class="chip" data-act="selAll">전체 선택</button><button class="chip" data-act="selNew">아직 안 묶은 것만</button><button class="chip" data-act="selNone">선택 해제</button></div>' +
    '<div class="row" style="margin-top:8px"><label class="f" style="min-width:170px">파일 하나의 최대 크기<select class="in" id="pkgLimit">' + [["10", "10 MB"], ["20", "20 MB (메일 권장)"], ["25", "25 MB"], ["0", "나누지 않음"]].map(o => '<option value="' + o[0] + '"' + (lim === o[0] ? " selected" : "") + '>' + o[1] + '</option>').join("") + '</select></label>' +
    '<button class="btn p" id="pkgBtn" data-act="mkPkg" style="margin-top:15px">패키지 만들기</button></div>' +
    '<div id="pkgOut"></div>' +
    '<p class="note">암호는 걸리지 않습니다. 받는 사람이 사내 PC에서 압축을 풀면 comments.csv(엑셀용)·comments.json(업로드용)·photos 폴더·manifest.json(파일별 해시)이 나옵니다. 용량을 넘으면 여러 파일로 나뉩니다. 공유 창이 열렸다는 것만 알 수 있고, 실제로 전송됐는지는 확인되지 않습니다.</p><p class="note"><b>보내기</b>: 카카오톡·메일 등을 고르는 공유 창이 열립니다. 크롬이 zip 공유를 막아서 파일 이름 끝에 <b>.txt</b>가 붙으니, 받는 쪽에서 .txt를 지우면 zip입니다. <b>저장</b>: 폰에 zip 그대로 저장하며, ‘내 파일’ 앱에서 길게 눌러 공유할 수도 있습니다.</p></div>';
}
function updatePkgBtn() { const b = $("#pkgBtn"); if (!b) return; const n = S.records.filter(r => S.sel.has(r.id)).length; b.textContent = S.pkgBusy ? "만드는 중…" : n ? "선택한 " + n + "건 패키지 만들기" : "패키지 만들기"; b.disabled = S.pkgBusy || !n; }
function renderPkgOut() {
  const el = $("#pkgOut"); if (!el) return;
  el.innerHTML = S.pkgs.length ? '<div class="stack" style="margin-top:10px">' + S.pkgs.map((p, i) =>
    '<div class="perm"><div style="flex:1;min-width:0"><b style="word-break:break-all">' + esc(p.name) + '</b><div class="mut">코멘트 ' + p.records + '건 · 사진 ' + p.photos + '장 · ' + kb(p.size) + (p.done ? ' · <span style="color:var(--ok)">' + esc(p.done) + '</span>' : "") + '</div></div>' +
    '<button class="btn p sm" data-act="sendPkg" data-i="' + i + '">보내기</button><button class="btn sm" data-act="savePkg" data-i="' + i + '">저장</button></div>').join("") + '</div>' : "";
}

/* ===== 이벤트 ===== */
let delArm = null, wipeArm = null;
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, d = S.draft;
  if (a === "tab") showTab(b.dataset.tab);
  else if (a === "askPerm") askPerm();
  else if (a === "recheck") { await refreshPerms(); await gateCheck(); if (S.tab === "set") renderSet(); }
  else if (a === "locType") { S.ctx.locType = b.dataset.v; S.ctx.loc = ""; lsSet("ctx", S.ctx); renderCtx(); }
  else if (a === "src") { S.ctx.source = b.dataset.v; lsSet("ctx", S.ctx); renderCtx(); }
  else if (a === "openCam") openCam();
  else if (a === "diag") runDiag();
  else if (a === "camRot") { lsSet("camRot", b.dataset.v); renderSet(); }
  else if (a === "sensor") runSensor();
  else if (a === "diagCopy") { try { await navigator.clipboard.writeText($("#diagOut").textContent); toast("복사했습니다."); } catch (e) { toast("복사하지 못했습니다. 화면을 캡처해 주세요."); } }
  else if (a === "pickPhoto") $("#pickFile").click();
  else if (a === "torch") setTorch(!S.torch);
  else if (a === "shot") shot();
  else if (a === "flip") flipCam();
  else if (a === "closeCam") closeCam();
  else if (a === "viewPhoto") showPhoto(b.dataset.id);
  else if (a === "closeLb") closeLb();
  else if (a === "rmPhoto") { S.photos = S.photos.filter(p => p.id !== b.dataset.id); renderPhotos(); if (d) renderRight(); }
  else if (a === "mic") { if (S.listening) stopVoice(); else startVoice(); }
  else if (a === "classify") doClassify();
  else if (a === "clear") { stopVoice(); S.photos = []; S.draft = null; S.rawVoice = ""; S.voiceConf = []; $("#text").value = ""; voiceMsg(""); renderPhotos(); renderRight(); renderMic(); }
  else if (a === "partner" && d) { d.partner.value = b.dataset.v; d.partner.ok = true; renderRight(); }
  else if (a === "okItem" && d) { d.items[+b.dataset.i].ok = true; renderRight(); }
  else if (a === "register") register();
  else if (a === "status") { const r = S.records.find(x => x.id === b.dataset.id); r.status = r.status === "미결" ? "종결" : "미결"; await DB.put("records", r); renderList(); }
  else if (a === "delRec") {
    if (delArm !== b.dataset.id) { delArm = b.dataset.id; b.textContent = "정말 삭제"; setTimeout(() => { if (delArm === b.dataset.id) { delArm = null; if (b.isConnected) b.textContent = "삭제"; } }, 3000); return; }
    delArm = null; const r = S.records.find(x => x.id === b.dataset.id); await DB.del("records", r.id);
    S.records = S.records.filter(x => x.id !== r.id); S.sel.delete(r.id);
    for (const p of r.photos) if (!S.records.some(x => x.photos.some(y => y.id === p.id))) await DB.del("photos", p.id);
    renderCount(); renderList(); toast("삭제했습니다.");
  }
  else if (a === "sel") { if (b.checked) S.sel.add(b.dataset.id); else S.sel.delete(b.dataset.id); updatePkgBtn(); return; }
  else if (a === "selAll") { S.records.forEach(r => S.sel.add(r.id)); renderList(); }
  else if (a === "selNew") { S.sel = new Set(S.records.filter(r => !r.packaged_at).map(r => r.id)); renderList(); }
  else if (a === "selNone") { S.sel.clear(); renderList(); }
  else if (a === "mkPkg") makePkg();
  else if (a === "sendPkg") sendPkg(+b.dataset.i);
  else if (a === "savePkg") savePkg(+b.dataset.i);
  else if (a === "expCsv") expCsv();
  else if (a === "expJson") expJson();
  else if (a === "wipe") {
    if (!wipeArm) { wipeArm = true; b.textContent = "정말 전체 삭제(되돌릴 수 없음)"; setTimeout(() => { wipeArm = null; if (b.isConnected) b.textContent = "저장한 코멘트 전체 삭제"; }, 4000); return; }
    wipeArm = null; await DB.clear("records"); await DB.clear("photos"); S.records = []; S.sel.clear(); S.pkgs = []; renderCount(); renderList(); renderSet(); toast("전체 삭제했습니다.");
  }
  else if (a === "install" && S.installEv) { S.installEv.prompt(); try { await S.installEv.userChoice; } catch (e2) { } S.installEv = null; renderSet(); $("#installBtn").hidden = true; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.c) { S.ctx[t.dataset.c] = t.value.trim(); lsSet("ctx", S.ctx); }
  else if (t.dataset.f === "itext" && S.draft) S.draft.items[+t.dataset.i].text = t.value;
  else if (t.dataset.f === "loc" && S.draft) S.draft.loc = t.value;
});
document.addEventListener("change", e => {
  const t = e.target, d = S.draft;
  if (t.id === "camFlip") { lsSet("camFlip", t.checked); return; }
  if (t.dataset.c === "kind") { S.ctx.kind = t.value; lsSet("ctx", S.ctx); }
  else if (!d) return;
  else if (t.dataset.f === "itype") { const it = d.items[+t.dataset.i]; it.type = t.value; it.ok = true; renderRight(); }
  else if (t.dataset.f === "kind") d.kind = t.value;
});
$("#pickFile").addEventListener("change", e => { const fs = Array.from(e.target.files || []); e.target.value = ""; if (fs.length) addFiles(fs); });
$("#installBtn").addEventListener("click", () => showTab("set"));
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEv = e; $("#installBtn").hidden = false; if (S.tab === "set") renderSet(); });
window.addEventListener("appinstalled", () => { S.installEv = null; $("#installBtn").hidden = true; toast("앱이 설치되었습니다."); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#lb").hidden) closeLb(); else if (!$("#cam").hidden) closeCam(); } });
document.addEventListener("visibilitychange", () => { if (document.hidden) { closeCam(); stopVoice(); } else refreshPerms().then(gateCheck); });

/* ===== 시작 ===== */
async function enterApp() {
  S.entered = true;
  try { await DB.open(); S.records = (await DB.all("records")).sort((a, b) => (b.created_at + b.id).localeCompare(a.created_at + a.id)); } catch (e) { toast("이 브라우저에서는 저장소를 열 수 없습니다. 기록이 저장되지 않습니다."); }
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { }
  $("#verPill").textContent = "v" + APP_VER;
  $("#gate").hidden = true; $("#app").hidden = false;
  if (S.ctx.kind) { const rp = KIND_REP[kindKey(S.ctx.kind)]; S.ctx.kind = rp ? rp.id : ""; lsSet("ctx", S.ctx); }
  renderCtx(); renderPhotos(); renderRight(); renderCount(); renderList(); renderMic();
}
(async function init() {
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => { });
  await refreshPerms();
  await gateCheck();
})();
</script>
</body>
